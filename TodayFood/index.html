<!doctype html>
<html lang="ko" data-theme="light" data-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 식단표</title>
<meta name="description" content="한 주 식단을 계획하고 장 볼 목록을 정리하는 개인용 식단표">
<meta name="theme-color" content="#FFF8EC">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="식단표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* 흰 화면 번쩍임 방지: 저장된 화면 모드를 CSS보다 먼저 적용 */
(function () {
  var mode = 'system';
  try { var v = localStorage.getItem('meal.theme'); if (v === 'light' || v === 'dark') mode = v; } catch (e) {}
  var dark = mode === 'dark' || (mode === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var r = document.documentElement;
  r.setAttribute('data-mode', mode);
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#1B1612' : '#FFF8EC');
})();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ===== 색상 변수 ===== */
:root {
  --bg: #FFF8EC;
  --card: #FFFFFF;
  --card-hover: #FFF6EA;
  --text: #3B2A20;
  --muted: #6B5A4E;
  --line: #EADBC6;
  --accent: #C2410C;
  --accent-hover: #9A3412;
  --on-accent: #FFFFFF;
  --accent-soft: #FFEBDC;
  --accent-soft-hover: #FFDCC2;
  --accent-text: #A93A0B;
  --icon-hover: rgba(194, 65, 12, 0.12);
  --danger: #B91C1C;
  --danger-hover: #991B1B;
  --danger-soft: rgba(185, 28, 28, 0.12);
  --focus: #1D4ED8;
  --field: #FFFDF8;
  --shadow: 0 1px 2px rgba(90, 45, 10, 0.08), 0 1px 1px rgba(90, 45, 10, 0.04);
  --shadow-hover: 0 6px 16px rgba(90, 45, 10, 0.16);
  --shadow-press: 0 1px 1px rgba(90, 45, 10, 0.06);
  --backdrop: rgba(40, 20, 5, 0.45);
  /* 끼니 색 */
  --m-b: #FFF1BF; --m-b-h: #FFF6D6; --m-b-ink: #765600;
  --m-l: #DDF2D1; --m-l-h: #E9F7E1; --m-l-ink: #2D6A28;
  --m-d: #FFE2CB; --m-d-h: #FFECDC; --m-d-ink: #96430E;
  --m-s: #FFDDE7; --m-s-h: #FFE9EF; --m-s-ink: #A12F59;
  /* 움직임 (줄이기 설정 시 0으로) */
  --lift: -2px;
  --pop: 1.08;
  --press: 0.97;
  --ease: 0.18s ease;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1B1612;
  --card: #26201A;
  --card-hover: #302820;
  --text: #F3E9DC;
  --muted: #BCAC9B;
  --line: #43382D;
  --accent: #FFA564;
  --accent-hover: #FFBC8A;
  --on-accent: #2A1405;
  --accent-soft: #3A2819;
  --accent-soft-hover: #4A321F;
  --accent-text: #FFB27A;
  --icon-hover: rgba(255, 165, 100, 0.16);
  --danger: #FF8A80;
  --danger-hover: #FFA8A0;
  --danger-soft: rgba(255, 138, 128, 0.16);
  --focus: #8AB4FF;
  --field: #1F1A15;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.5);
  --shadow-press: 0 1px 1px rgba(0, 0, 0, 0.3);
  --backdrop: rgba(0, 0, 0, 0.6);
  --m-b: #423914; --m-b-h: #4D431A; --m-b-ink: #FFD866;
  --m-l: #1F3B24; --m-l-h: #26462C; --m-l-ink: #A3DE96;
  --m-d: #472B16; --m-d-h: #53331C; --m-d-ink: #FFB784;
  --m-s: #462233; --m-s-h: #52293D; --m-s-ink: #FFAFC9;
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) {
  :root { --lift: 0px; --pop: 1; --press: 1; }
  *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
}

/* ===== 기본 ===== */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
h1, h2, h3 { font-weight: 700; line-height: 1.3; margin: 0; }
strong, b { font-weight: 600; }
button { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}

/* ===== 상단 ===== */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.brand img { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.brand h1 { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 2px; }
.weeknav { display: flex; align-items: center; gap: 4px; padding-bottom: 8px; }
.range {
  flex: 1; min-width: 0; text-align: center; font-weight: 700;
  font-size: clamp(15px, 4.4vw, 18px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn.small { min-height: 44px; padding: 0 12px; font-size: 14px; border-radius: 22px; flex: none; margin-right: 4px; white-space: nowrap; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 4px; }
.toolbar .btn { flex: 1 1 auto; }

.banner {
  margin: 12px 0 0; padding: 10px 14px; border-radius: 12px;
  background: var(--danger-soft); color: var(--text); border: 1px solid var(--danger);
  font-size: 15px; display: flex; gap: 8px; align-items: flex-start;
}
.banner p { margin: 0; flex: 1; }

/* ===== 버튼 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px;
  border: 1.5px solid transparent; border-radius: 12px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 600; font-size: 15px; line-height: 1.2; text-align: center;
  cursor: pointer; box-shadow: var(--shadow);
  transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease), transform var(--ease);
}
.btn-sub { background: var(--card); color: var(--text); border-color: var(--line); }
.btn-danger { background: var(--danger); color: var(--on-accent); }
:root[data-theme="dark"] .btn-danger { color: #2A0A08; }
.btn:disabled, .icon-btn:disabled, .chip:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

.icon-btn {
  position: relative; display: inline-grid; place-items: center; flex: none;
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--text); cursor: pointer; font-size: 20px; line-height: 1;
  transition: color var(--ease), transform var(--ease);
}
.icon-btn::before {
  content: ""; position: absolute; inset: 2px; border-radius: 50%;
  background: var(--icon-hover); opacity: 0; transition: opacity var(--ease), background-color var(--ease);
}
.icon-btn > * { position: relative; transition: transform var(--ease); }
.icon-btn.del { color: var(--muted); }
.icon-btn.del::before { background: var(--danger-soft); }
.icon-btn.on { color: var(--accent-text); }
.icon-btn.on svg.i { fill: currentColor; }

/* ===== 주간 식단표 ===== */
.week { display: grid; gap: 12px; padding: 12px 0 calc(32px + env(safe-area-inset-bottom)); }
.day {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px;
  padding: 10px 12px 12px; box-shadow: var(--shadow);
  scroll-margin-top: calc(var(--top-h, 120px) + 12px);
}
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.day-head { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 6px; }
.dow {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 15px;
}
.today .dow { background: var(--accent); color: var(--on-accent); }
.day-date { font-weight: 700; font-size: 17px; }
.badge {
  font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text);
}
.day-head .icon-btn { margin-left: auto; color: var(--muted); }
.meals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.cell {
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  width: 100%; min-height: 92px; padding: 8px 12px 10px; margin: 0;
  border: 1.5px solid transparent; border-radius: 14px;
  background: var(--mc); color: var(--text); text-align: left; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
}
.cell.m-b { --mc: var(--m-b); --mch: var(--m-b-h); --mink: var(--m-b-ink); }
.cell.m-l { --mc: var(--m-l); --mch: var(--m-l-h); --mink: var(--m-l-ink); }
.cell.m-d { --mc: var(--m-d); --mch: var(--m-d-h); --mink: var(--m-d-ink); }
.cell.m-s { --mc: var(--m-s); --mch: var(--m-s-h); --mink: var(--m-s-ink); }
.cell .lab { font-size: 13px; font-weight: 600; color: var(--mink); }
.cell .items { display: flex; flex-direction: column; font-size: 15px; line-height: 1.45; }
.cell .it { display: block; }
.cell .add { font-size: 14px; color: var(--muted); transition: color var(--ease); }

/* 태블릿 */
@media (min-width: 600px) {
  .meals { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
/* PC: 표 형태 (7일 × 4끼) */
@media (min-width: 960px) {
  .week { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: start; }
  .day { padding: 8px; }
  .day-head { gap: 4px; flex-wrap: nowrap; }
  .dow { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
  .day-date { font-size: 15px; white-space: nowrap; }
  .day-head .mo, .day-head .badge { display: none; }
  .meals { grid-template-columns: 1fr; gap: 6px; }
  .cell { min-height: 104px; padding: 8px 10px; }
  @media (min-width: 1200px) { .day-head .mo { display: inline; } }
  @supports (grid-template-rows: subgrid) {
    .week { grid-template-rows: auto repeat(4, auto); row-gap: 0; align-items: stretch; }
    .day { display: grid; grid-row: span 5; grid-template-rows: subgrid; row-gap: 6px; }
    .day-head { margin-bottom: 0; }
    .meals { display: contents; }
  }
}

/* ===== 보기 전환 (주간/월간) ===== */
.viewtabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 12px; padding: 4px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
}
.vtab {
  min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font-weight: 600; font-size: 15px; cursor: pointer;
  transition: background-color var(--ease), color var(--ease), transform var(--ease);
}
.vtab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ===== 월간 달력 ===== */
.month { padding: 12px 0 calc(32px + env(safe-area-inset-bottom)); }
.mgrid {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
}
.mdow { padding: 8px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
.mday {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 0; min-height: 88px;
  padding: 4px 3px 6px; margin: 0; border: 0; border-radius: 0;
  border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  background: var(--card); color: var(--text); text-align: left; cursor: pointer;
  transition: background-color var(--ease), box-shadow var(--ease), transform var(--ease);
}
.mday:nth-child(7n + 1) { border-left: 0; }
.mday:nth-child(-n + 14) { border-top: 0; }
.mday.out { background: var(--bg); }
.mday.out .mnum, .mday.out .mm { opacity: 0.5; }
.mnum { font-size: 13px; font-weight: 700; line-height: 1.3; padding: 1px 3px; align-self: flex-start; border-radius: 999px; }
.mday.today { box-shadow: inset 0 0 0 2px var(--accent); }
.mday.today .mnum { background: var(--accent); color: var(--on-accent); padding: 1px 6px; }
.mm {
  display: block; min-width: 0; padding: 1px 4px; border-radius: 5px;
  background: var(--mc); color: var(--text); font-size: 11px; line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mm.m-b { --mc: var(--m-b); --mink: var(--m-b-ink); }
.mm.m-l { --mc: var(--m-l); --mink: var(--m-l-ink); }
.mm.m-d { --mc: var(--m-d); --mink: var(--m-d-ink); }
.mm.m-s { --mc: var(--m-s); --mink: var(--m-s-ink); }
.mm b { color: var(--mink); font-weight: 600; margin-right: 3px; }
.mhint { color: var(--muted); font-size: 14px; margin: 10px 2px 0; }
.mlegend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 0 2px 10px; font-size: 13px; color: var(--muted); }
.mlegend span { display: inline-flex; align-items: center; gap: 5px; }
.mlegend i { width: 12px; height: 12px; border-radius: 4px; background: var(--mc); display: inline-block; }
.day.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent), var(--shadow-hover); } 100% { box-shadow: var(--shadow); } }
/* 좁은 화면: 끼니 이름표 대신 색으로만 구분 */
@media (max-width: 599px) {
  .mm b { display: none; }
  .mm { padding: 1px 3px; font-size: 10.5px; line-height: 1.3; border-radius: 4px; white-space: normal; word-break: break-all; }
  .mi { display: block; }
  .mi + .mi { margin-top: 1px; padding-top: 1px; border-top: 1px dashed rgba(0, 0, 0, 0.12); }
  :root[data-theme="dark"] .mi + .mi { border-top-color: rgba(255, 255, 255, 0.14); }
}
@media (min-width: 600px) {
  .mi + .mi::before { content: ", "; }
}
@media (min-width: 960px) {
  .mday { min-height: 120px; padding: 6px 6px 8px; gap: 3px; }
  .mnum { font-size: 14px; }
  .mm { font-size: 12.5px; padding: 2px 6px; }
}

/* ===== 시트(대화상자) ===== */
dialog {
  border: 0; padding: 0; margin: auto auto 0;
  width: 100%; max-width: 560px; max-height: min(90vh, 90dvh);
  background: var(--card); color: var(--text);
  border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.18);
  overflow: hidden;
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: var(--backdrop); }
dialog.center { margin: auto; max-width: 400px; width: calc(100% - 32px); border-radius: 20px; }
@media (min-width: 640px) { dialog { margin: auto; border-radius: 22px; width: calc(100% - 48px); } }
.sheet-head {
  display: flex; align-items: center; gap: 8px; padding: 12px 8px 8px 20px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { flex: 1; font-size: 18px; }
.sheet-body {
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.sheet-body h3 { font-size: 15px; font-weight: 700; margin: 20px 0 8px; }
.sheet-body h3:first-child { margin-top: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.row .btn { flex: 1 1 auto; }
.stack { display: grid; gap: 8px; }
.stack .btn { width: 100%; }

input[type="text"], input[type="date"] {
  width: 100%; min-height: 48px; padding: 10px 14px; margin: 0;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--field); color: var(--text); font-size: 16px;
  transition: border-color var(--ease), box-shadow var(--ease);
}
input[type="text"]:focus, input[type="date"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--icon-hover); }
input[type="text"]:focus-visible, input[type="date"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input::placeholder { color: var(--muted); opacity: 1; }
label.lbl { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
.field { position: relative; }

/* 메뉴 목록(편집 시트) */
.edlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.li {
  display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 14px;
  border: 1.5px solid var(--line); border-radius: 14px; background: var(--card);
  transition: background-color var(--ease), border-color var(--ease);
}
.li.editing { border-color: var(--accent); background: var(--accent-soft); }
.li-main { flex: 1; min-width: 0; }
.li-name { font-weight: 600; }
.li-ing { font-size: 14px; color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; padding: 8px 0; margin: 0; }

/* 자동완성 */
.sug {
  list-style: none; margin: 4px 0 0; padding: 4px; position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-hover);
  max-height: 240px; overflow-y: auto;
}
.sug button {
  display: block; width: 100%; min-height: 44px; padding: 8px 12px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text); text-align: left; cursor: pointer;
  transition: background-color var(--ease);
}
.sug button.active { background: var(--accent-soft); }
.sug small { display: block; color: var(--muted); font-size: 13px; }

/* 즐겨찾기 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipgrp { display: inline-flex; align-items: stretch; }
.chip {
  min-height: 44px; padding: 0 12px 0 14px; border: 1.5px solid var(--line); border-right: 0;
  border-radius: 22px 0 0 22px; background: var(--accent-soft); color: var(--text);
  font-weight: 600; font-size: 15px; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
}
.chip-x {
  min-height: 44px; width: 40px; border: 1.5px solid var(--line); border-left: 1px solid var(--line);
  border-radius: 0 22px 22px 0; background: var(--accent-soft); color: var(--muted);
  cursor: pointer; font-size: 18px; line-height: 1;
  transition: background-color var(--ease), color var(--ease), border-color var(--ease), transform var(--ease);
}

/* 장 볼 목록 */
.shop { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.shop label {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px;
  border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
  transition: background-color var(--ease), border-color var(--ease);
}
.shop input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.shop input:checked + span { text-decoration: line-through; color: var(--muted); }
.shop-count { color: var(--muted); font-size: 14px; font-weight: 400; }

/* 설정 */
.set-sec + .set-sec { margin-top: 8px; }
.danger-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
.status { font-size: 14px; color: var(--muted); margin: 0 0 4px; }

/* 확인창 */
.cf-body { padding: 22px 20px 18px; }
.cf-body h2 { font-size: 18px; margin-bottom: 8px; }
.cf-body p { margin: 0; color: var(--text); white-space: pre-line; }
.cf-body form { display: flex; gap: 8px; margin-top: 18px; }
.cf-body form .btn { flex: 1; }

/* 토스트 */
.toast {
  position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); z-index: 100;
  display: flex; align-items: center; gap: 4px; max-width: calc(100% - 24px); width: max-content;
  padding: 6px 6px 6px 16px; min-height: 48px; border-radius: 14px;
  background: var(--text); color: var(--bg); box-shadow: var(--shadow-hover);
  font-size: 15px; font-weight: 600;
  opacity: 0; pointer-events: none; transform: translate(-50%, -8px);
  transition: opacity var(--ease), transform var(--ease);
}
.toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.toast .tmsg { padding-right: 10px; }
.toast:not(:has(.tbtn)) { padding-right: 16px; }
.tbtn {
  min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px;
  background: transparent; color: var(--accent-soft); font-weight: 700; cursor: pointer; text-decoration: underline;
  transition: background-color var(--ease), transform var(--ease);
}
@media (prefers-reduced-motion: reduce) { .toast, .toast.show { transform: translate(-50%, 0); } }

/* ===== 호버 효과: 마우스(정밀 포인터) 기기에서만 ===== */
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover { background: var(--accent-hover); transform: translateY(var(--lift)); box-shadow: var(--shadow-hover); }
  .btn-sub:not(:disabled):hover { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .btn-danger:not(:disabled):hover { background: var(--danger-hover); }
  .icon-btn:not(:disabled):hover::before { opacity: 1; }
  .icon-btn:not(:disabled):hover > * { transform: scale(var(--pop)); }
  .icon-btn.del:not(:disabled):hover { color: var(--danger); }
  .cell:hover { border-color: var(--accent); background: var(--mch); }
  .cell:hover .add { color: var(--accent-text); }
  .chip:not(:disabled):hover { background: var(--accent-soft-hover); border-color: var(--accent); transform: translateY(var(--lift)); box-shadow: var(--shadow-hover); }
  .chip-x:hover { color: var(--danger); background: var(--danger-soft); }
  .li:hover { background: var(--card-hover); }
  .vtab[aria-pressed="false"]:hover { background: var(--accent-soft); color: var(--text); }
  .mday:hover { background: var(--card-hover); box-shadow: inset 0 0 0 2px var(--accent); }
  .mday.out:hover { background: var(--card-hover); }
  .li.editing:hover { background: var(--accent-soft); }
  .shop label:hover { background: var(--card-hover); border-color: var(--accent); }
  .sug button:hover { background: var(--accent-soft); }
  .tbtn:hover { background: rgba(255, 255, 255, 0.14); }
  :root[data-theme="dark"] .tbtn:hover { background: rgba(0, 0, 0, 0.1); }
}

/* ===== 눌렀을 때 (터치 포함) ===== */
.btn:not(:disabled):active { transform: scale(var(--press)); box-shadow: var(--shadow-press); }
.icon-btn:not(:disabled):active > * { transform: scale(var(--press)); }
.icon-btn:not(:disabled):active::before { opacity: 1; }
.cell:active { transform: scale(var(--press)); }
.chip:not(:disabled):active, .chip-x:active { transform: scale(var(--press)); box-shadow: none; }
.tbtn:active { transform: scale(var(--press)); }
.vtab:active { transform: scale(var(--press)); }
.mday:active { background: var(--card-hover); }
.sug button:active { background: var(--accent-soft); }
</style>
</head>

      <button type="button" class="btn btn-sub" id="st-export"><span data-ico="down"></span>데이터 내보내기 (JSON 파일 저장)</button>

    <p class="hint">기기를 바꾸거나 브라우저 데이터를 지우기 전에 내보내기로 백업해 두세요.</p>

</dialog>

<script>
'use strict';
(function () {
  /* ---------- 상수·도우미 ---------- */
  var KEY = 'meal.v1';
  var THEME_KEY = 'meal.theme';
  var MEALS = [{ k: 'b', n: '아침' }, { k: 'l', n: '점심' }, { k: 'd', n: '저녁' }, { k: 's', n: '간식' }];
  var MEAL_NAME = { b: '아침', l: '점심', d: '저녁', s: '간식' };
  var DOW = ['월', '화', '수', '목', '금', '토', '일'];
  var ICONS = {

    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/>',

  };
  function ico(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).trim().replace(/\s+/g, ' ').toLowerCase(); }
  function clean(s, max) { return String(s).trim().replace(/\s+/g, ' ').slice(0, max); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function pdate(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  function parseIngs(text) {
    var out = [], seen = {};
    String(text).split(/[,，、;\n]/).forEach(function (x) {
      var v = clean(x, 40); if (!v) return;
      var k = norm(v); if (seen[k]) return; seen[k] = 1; out.push(v);

  }
  function fillIcons(root) {
    $$('[data-ico]', root).forEach(function (el) { el.outerHTML = ico(el.getAttribute('data-ico')); });
  }

  /* ---------- 저장소 ---------- */
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var storageOk = true;
  function emptyDb() { return { meals: {}, favs: [], shop: {} }; }
  function cleanItem(it) {
    if (!it || typeof it !== 'object' || typeof it.n !== 'string') return null;
    var n = clean(it.n, 60); if (!n) return null;
    var g = Array.isArray(it.g) ? parseIngs(it.g.filter(function (x) { return typeof x === 'string'; }).join(',')) : [];
    return { n: n, g: g };
  }
  function cleanList(arr) {
    var out = [], seen = {};
    (Array.isArray(arr) ? arr : []).forEach(function (it) {
      var c = cleanItem(it); if (!c) return;
      var k = norm(c.n); if (seen[k]) return; seen[k] = 1; out.push(c);
    });
    return out;
  }
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  /* 구조가 맞지 않으면 null, 맞으면 정리된 데이터 */
  function sanitize(raw) {
    if (!isObj(raw)) return null;
    if (!isObj(raw.meals) && !Array.isArray(raw.favs)) return null;
    var out = emptyDb();
    if (isObj(raw.meals)) {
      Object.keys(raw.meals).forEach(function (d) {

    out.favs = cleanList(raw.favs).slice(0, 300);
    if (isObj(raw.shop)) {
      Object.keys(raw.shop).forEach(function (w) {
        if (!DATE_RE.test(w) || !isObj(raw.shop[w])) return;
        var o = {}; Object.keys(raw.shop[w]).forEach(function (k) { if (raw.shop[w][k] === true) o[k] = true; });
        out.shop[w] = o;
      });
    }
    return out;
  }
  function load() {
    try {
      localStorage.setItem('meal.__test', '1'); localStorage.removeItem('meal.__test');
    } catch (e) {
      storageOk = false;
      showBanner('이 브라우저에서는 데이터를 저장할 수 없어요(사생활 보호 모드 등). 지금 입력한 내용은 페이지를 닫으면 사라져요.');
      return emptyDb();
    }
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw == null) return emptyDb();
    try {
      var s = sanitize(JSON.parse(raw));
      if (!s) throw new Error('bad');
      return s;
    } catch (e) {
      try { localStorage.setItem(KEY + '.damaged', raw); } catch (e2) {}
      showBanner('저장된 데이터가 손상되어 빈 상태로 시작했어요. 백업 파일이 있다면 설정 > 데이터 불러오기로 복원하세요.');
      return emptyDb();
    }
  }
  function save() {
    if (!storageOk) return;
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) {
      storageOk = false;
      showBanner('저장 공간을 사용할 수 없어 변경 내용이 저장되지 않았어요. 설정에서 데이터를 내보내 백업해 두세요.');
    }
  }
  function showBanner(msg) { $('#banner-msg').textContent = msg; $('#banner').hidden = false; }

  var db = load();
  var view = { ws: weekStart(new Date()), mode: 'week', ms: monthStart(new Date()) };
  try { if (localStorage.getItem('meal.view') === 'month') view.mode = 'month'; } catch (e) {}

  function slot(k, m) { return (db.meals[k] && db.meals[k][m]) || []; }
  function setSlot(k, m, items) {
    if (items.length) { if (!db.meals[k]) db.meals[k] = {}; db.meals[k][m] = items; }
    else if (db.meals[k]) { delete db.meals[k][m]; if (!Object.keys(db.meals[k]).length) delete db.meals[k]; }
  }
  function hasName(items, name, skip) {
    var k = norm(name);
    return items.some(function (it, i) { return i !== skip && norm(it.n) === k; });
  }
  /* 대상 칸에 없는 메뉴만 합치기 → 추가된 개수 */
  function mergeInto(k, m, items) {
    var cur = slot(k, m).slice(), added = 0;
    items.forEach(function (it) { if (!hasName(cur, it.n)) { cur.push({ n: it.n, g: it.g.slice() }); added++; } });
    setSlot(k, m, cur);
    return added;
  }

  /* ---------- 화면 모드 ---------- */
  var root = document.documentElement;
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  var MODE_ORDER = ['system', 'light', 'dark'];
  var MODE_LABEL = { system: '시스템 설정 따르기', light: '라이트', dark: '다크' };

      }
      save(); render();
      toast(added ? '지난주 식단에서 메뉴 ' + added + '개를 불러왔어요' : '이미 지난주와 같은 메뉴가 모두 있어요');
    };
    if (countWeek(view.ws)) {
      askConfirm({ title: '지난주 식단 불러오기', msg: '이번 주에 이미 입력된 식단이 있어요.\n지난주 식단을 합칠까요? (같은 메뉴는 중복되지 않아요)', ok: '합치기' })
        .then(function (ok) { if (ok) go(); });
    } else go();
  }

  /* ---------- 장 볼 목록 ---------- */
  function shopItems() {
    var map = {}, list = [];
    weekDays().forEach(function (d) {
      var k = dkey(d);
      MEALS.forEach(function (m) {
        slot(k, m.k).forEach(function (it) {
          it.g.forEach(function (g) { var key = norm(g); if (!map[key]) { map[key] = 1; list.push({ key: key, name: g }); } });
        });
      });
    });
    return list.sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); });
  }
  function renderShop() {
    var wk = dkey(view.ws), checked = db.shop[wk] || {};
    var items = shopItems();
    var done = items.filter(function (x) { return checked[x.key]; }).length;
    $('#sh-range').textContent = $('#range').textContent + ' 식단의 재료 (중복 없이 합침)';
    $('#sh-count').textContent = items.length ? '(' + done + '/' + items.length + ')' : '';
    $('#sh-list').innerHTML = items.length ? items.map(function (x, i) {
      return '<li><label><input type="checkbox" data-shop="' + esc(x.key) + '"' + (checked[x.key] ? ' checked' : '') + '><span>' + esc(x.name) + '</span></label></li>';
    }).join('') : '<li class="empty">이번 주 식단에 입력된 재료가 없어요.<br>메뉴를 추가할 때 "필요한 재료"를 적어 두면 여기에 모여요.</li>';
  }
  $('#sh-list').addEventListener('change', function (e) {
    var c = e.target.closest('input[data-shop]'); if (!c) return;
    var wk = dkey(view.ws);
    if (!db.shop[wk]) db.shop[wk] = {};
    if (c.checked) db.shop[wk][c.getAttribute('data-shop')] = true; else delete db.shop[wk][c.getAttribute('data-shop')];
    if (!Object.keys(db.shop[wk]).length) delete db.shop[wk];
    save();
    var items = shopItems(), cur = db.shop[wk] || {};
    $('#sh-count').textContent = '(' + items.filter(function (x) { return cur[x.key]; }).length + '/' + items.length + ')';
  });

  /* ---------- 텍스트로 복사 ---------- */
  function weekText() {
    var lines = ['[' + $('#range').textContent + ' 식단]', ''];
    weekDays().forEach(function (d, i) {
      var k = dkey(d), any = false;
      lines.push(DOW[i] + '요일 (' + (d.getMonth() + 1) + '/' + d.getDate() + ')');
      MEALS.forEach(function (m) {
        var items = slot(k, m.k);
        if (items.length) { any = true; lines.push(m.n + ': ' + items.map(function (x) { return x.n; }).join(', ')); }
      });
      if (!any) lines.push('(식단 없음)');
      lines.push('');
    });
    return lines.join('\n').trim() + '\n';
  }
  function copyText(text) {
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
        (topOpen() || document.body).appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy'); ta.remove(); return Promise.resolve(ok);
      } catch (e) { return Promise.resolve(false); }
    };
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    }
    return fallback();
  }

  /* ---------- 설정: 백업·복원·초기화 ---------- */
  function updateStatus() {
    $('#st-status').textContent = storageOk
      ? '데이터는 이 기기의 브라우저에만 저장돼요. (식단 ' + Object.keys(db.meals).length + '일, 즐겨찾기 ' + db.favs.length + '개)'
      : '⚠️ 지금은 저장이 되지 않는 상태예요. 내보내기로 백업해 두세요.';
  }
  $('#st-export').addEventListener('click', function () {
    var now = new Date();
    var payload = { app: 'meal-planner', version: 1, exportedAt: now.toISOString(), data: db };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '식단표-백업-' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('백업 파일을 저장했어요');
    } catch (e) { alertMsg('내보내기 실패', '파일을 만들지 못했어요. 다른 브라우저에서 다시 시도해 주세요.'); }
  });
  $('#st-import').addEventListener('click', function () { $('#st-file').click(); });
  $('#st-file').addEventListener('change', function () {
    var input = this, f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    var bad = function () { alertMsg('불러오기 실패', '올바른 식단표 백업 파일이 아니에요.\n기존 데이터는 그대로 유지돼요.'); };
    if (f.size > 5 * 1024 * 1024) { bad(); return; }
    var reader = new FileReader();
    reader.onerror = bad;
    reader.onload = function () {
      var obj, data;
      try { obj = JSON.parse(String(reader.result).replace(/^﻿/, '')); } catch (e) { bad(); return; }
      data = obj && obj.app === 'meal-planner' ? sanitize(obj.data) : null;
      if (!data) { bad(); return; }
      askConfirm({ title: '데이터 불러오기', msg: '지금 이 기기에 있는 식단·즐겨찾기가 백업 파일 내용으로 모두 덮어써져요.\n계속할까요?', ok: '덮어쓰기', danger: true })
        .then(function (ok) {
          if (!ok) return;
          db = data; save(); render(); updateStatus();
          toast('백업을 불러왔어요 (식단 ' + Object.keys(db.meals).length + '일)');
        });
    };
    reader.readAsText(f);
  });
  $('#st-reset').addEventListener('click', function () {
    askConfirm({ title: '전체 데이터 초기화', msg: '식단·즐겨찾기·장 볼 목록 체크가 모두 삭제돼요.\n계속할까요?', ok: '계속', danger: true })
      .then(function (ok) {
        if (!ok) return null;
        return askConfirm({ title: '정말 삭제할까요?', msg: '삭제한 데이터는 되돌릴 수 없어요.\n필요하면 먼저 데이터 내보내기로 백업하세요.', ok: '모두 삭제', danger: true });
      })
      .then(function (ok) {
        if (!ok) return;
        db = emptyDb(); save(); render(); updateStatus();
        toast('모든 데이터를 삭제했어요');
      });
  });

  /* ---------- 클릭 처리 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'edit') openEditor(b.getAttribute('data-date'), b.getAttribute('data-meal'));
    else if (act === 'prev') { if (view.mode === 'month') goMonth(new Date(view.ms.getFullYear(), view.ms.getMonth() - 1, 1)); else goWeek(addDays(view.ws, -7)); }
    else if (act === 'next') { if (view.mode === 'month') goMonth(new Date(view.ms.getFullYear(), view.ms.getMonth() + 1, 1)); else goWeek(addDays(view.ws, 7)); }
    else if (act === 'today') { if (view.mode === 'month') goMonth(monthStart(new Date())); else goWeek(weekStart(new Date()), true); }
    else if (act === 'mode') {
      var md2 = b.getAttribute('data-mode'); if (md2 === view.mode) return;
      if (md2 === 'month') view.ms = monthStart(addDays(view.ws, 3));
      else { var t = new Date(); view.ws = (t.getFullYear() === view.ms.getFullYear() && t.getMonth() === view.ms.getMonth()) ? weekStart(t) : weekStart(view.ms); }
      setMode(md2); render();
      if (md2 === 'week') scrollToToday(); else window.scrollTo(0, 0);
    }
    else if (act === 'openday') openDay(b.getAttribute('data-date'));
    else if (act === 'copyday') {
      var k = b.getAttribute('data-date');
      if (!MEALS.some(function (m) { return slot(k, m.k).length; })) { toast('이 날은 아직 복사할 메뉴가 없어요'); return; }
      openCopy({ type: 'day', k: k });
    }
    else if (act === 'shop') { renderShop(); openDialog($('#dlg-shop')); }
    else if (act === 'lastweek') loadLastWeek();
    else if (act === 'copytext') {
      copyText(weekText()).then(function (ok) {
        toast(ok ? '주간 식단을 복사했어요. 메모 앱에 붙여 넣으세요' : '복사하지 못했어요. 브라우저 권한을 확인해 주세요');
      });
    }
    else if (act === 'settings') { updateStatus(); openDialog($('#dlg-set')); }
    else if (act === 'banner-close') $('#banner').hidden = true;
  });

  /* ---------- 시작 ---------- */
  fillIcons(document);
  applyTheme(root.getAttribute('data-mode') || 'system', false);
  render();
  measureTop();
  window.addEventListener('resize', measureTop);
  requestAnimationFrame(function () { measureTop(); if (view.mode === 'week') scrollToToday(); });
  var lastDay = dkey(new Date());
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && dkey(new Date()) !== lastDay) { lastDay = dkey(new Date()); render(); }
  });
})();
</script>
<script>
/* 서비스 워커 등록 (실패해도 앱은 정상 동작) */
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', function () {
    var hadController = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
})();
</script>
</body>
